<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <meta
    name="apple-mobile-web-app-capable"
    content="yes"
  >

  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <title>Nihongo</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #f7f6f2;
      color: #171717;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        sans-serif;
    }

    body {
      min-height: 100dvh;
    }

    #app {
      min-height: 100dvh;

      display: flex;
      align-items: center;
      justify-content: center;

      padding:
        calc(env(safe-area-inset-top) + 28px)
        28px
        calc(env(safe-area-inset-bottom) + 28px);

      text-align: center;
    }

    .conteudo {
      width: 100%;
      max-width: 430px;
    }

    .romaji {
      margin: 0;

      font-size: clamp(31px, 9vw, 42px);
      line-height: 1.18;

      font-weight: 650;
      letter-spacing: -.035em;
    }

    .traducao {
      margin-top: 18px;

      color: #77736c;

      font-size: 18px;
      line-height: 1.45;
    }

    .contador {
      height: 20px;
      margin-bottom: 30px;

      color: #9b9891;

      font-size: 12px;
      font-weight: 600;
      letter-spacing: .08em;
    }

    .acoes {
      display: flex;
      justify-content: center;

      gap: 22px;
      margin-top: 54px;
    }

    button {
      width: 78px;
      height: 78px;

      padding: 0;

      border: none;
      border-radius: 50%;

      background: white;
      color: #171717;

      font-size: 27px;

      box-shadow:
        0 5px 22px rgba(0,0,0,.08);

      cursor: pointer;

      transition:
        transform .12s ease,
        box-shadow .18s ease;
    }

    button:active {
      transform: scale(.94);
    }

    #micBtn.gravando {
      box-shadow:
        0 0 0 8px rgba(0,0,0,.05),
        0 0 0 17px rgba(0,0,0,.025);
    }

    .status {
      min-height: 24px;
      margin-top: 28px;

      color: #77736c;

      font-size: 14px;
      line-height: 1.45;
    }

    .status.certo {
      color: #171717;
      font-weight: 700;
    }

    .reouvir {
      display: none;

      margin-top: 9px;

      color: #77736c;

      font-size: 13px;

      text-decoration: underline;

      cursor: pointer;
    }

    .erro {
      color: #77736c;

      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div id="app"></div>

<script>

const API_URL =
  'https://script.google.com/macros/s/AKfycbyJbrVzTTKDSUp3nu7U3P6YkiI7qIheu6Hql_wqp_45hSBLjvje96GtDYgjg55CtopzxQ/exec';


let dados = null;
let indice = 0;

let mediaRecorder = null;
let stream = null;
let chunks = [];

let gravacaoURL = null;
let gravando = false;

let recognition = null;
let textoReconhecido = '';


/* =====================================================
   API
===================================================== */

window.nihongoCallback = function(resultado) {

  dados = resultado;

  if (
    !resultado ||
    resultado.ok === false
  ) {

    mostrarErro(
      resultado?.mensagem ||
      'Não foi possível carregar.'
    );

    return;
  }


  if (
    resultado.tipo === 'FIM_DE_SEMANA'
  ) {

    document.getElementById(
      'app'
    ).innerHTML = '';

    return;
  }


  if (
    !resultado.frases ||
    resultado.frases.length === 0
  ) {

    document.getElementById(
      'app'
    ).innerHTML = '';

    return;
  }


  indice = 0;

  renderizar();
};


function carregar() {

  const script =
    document.createElement('script');

  script.src =
    API_URL +
    '?callback=nihongoCallback&t=' +
    Date.now();

  script.onerror = function() {

    mostrarErro(
      'Não foi possível conectar ao Nihongo.'
    );

  };

  document.body.appendChild(
    script
  );
}


/* =====================================================
   TELA
===================================================== */

function renderizar() {

  const frase =
    dados.frases[indice];

  const total =
    dados.frases.length;

  const contador =
    dados.tipo === 'REVISAO'
      ? `${indice + 1} / ${total}`
      : '';


  document.getElementById(
    'app'
  ).innerHTML = `

    <div class="conteudo">

      <div class="contador">
        ${contador}
      </div>

      <h1 class="romaji">
        ${escapeHTML(frase.romaji)}
      </h1>

      <div class="traducao">
        ${escapeHTML(frase.portugues)}
      </div>

      <div class="acoes">

        <button
          type="button"
          onclick="ouvir()"
          aria-label="Ouvir"
        >
          ▶
        </button>

        <button
          type="button"
          id="micBtn"
          onclick="alternarMicrofone()"
          aria-label="Falar"
        >
          ●
        </button>

      </div>

      <div
        class="status"
        id="status"
      ></div>

      <div
        class="reouvir"
        id="reouvir"
        onclick="reouvir()"
      >
        Ouvir minha gravação
      </div>

    </div>
  `;
}


/* =====================================================
   OUVIR
===================================================== */

function ouvir() {

  const frase =
    dados.frases[indice];

  if (!window.speechSynthesis) {

    status(
      'Áudio não disponível.'
    );

    return;
  }


  speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      frase.japones
    );


  utterance.lang =
    'ja-JP';

  utterance.rate =
    0.82;

  utterance.pitch =
    1;


  const vozes =
    speechSynthesis.getVoices();


  const japonesa =
    vozes.find(voz =>
      String(voz.lang || '')
        .toLowerCase()
        .startsWith('ja')
    );


  if (japonesa) {
    utterance.voice =
      japonesa;
  }


  speechSynthesis.speak(
    utterance
  );
}


/* =====================================================
   MICROFONE
===================================================== */

async function alternarMicrofone() {

  if (gravando) {

    pararGravacao();

  } else {

    await iniciarGravacao();

  }
}


async function iniciarGravacao() {

  try {

    stream =
      await navigator.mediaDevices
        .getUserMedia({
          audio: true
        });


    chunks = [];
    textoReconhecido = '';


    let opcoes = {};


    const tipos = [
      'audio/mp4',
      'audio/webm;codecs=opus',
      'audio/webm'
    ];


    for (const tipo of tipos) {

      if (
        MediaRecorder.isTypeSupported &&
        MediaRecorder.isTypeSupported(tipo)
      ) {

        opcoes.mimeType =
          tipo;

        break;
      }
    }


    mediaRecorder =
      new MediaRecorder(
        stream,
        opcoes
      );


    mediaRecorder.ondataavailable =
      function(event) {

        if (
          event.data &&
          event.data.size
        ) {

          chunks.push(
            event.data
          );

        }
      };


    mediaRecorder.onstop =
      finalizarGravacao;


    iniciarReconhecimento();


    mediaRecorder.start();


    gravando = true;


    const botao =
      document.getElementById(
        'micBtn'
      );


    botao.classList.add(
      'gravando'
    );

    botao.textContent =
      '■';


    status(
      'Estou ouvindo…'
    );


  } catch (erro) {

    console.error(erro);

    status(
      'Não foi possível iniciar o microfone.'
    );
  }
}


/* =====================================================
   RECONHECIMENTO JAPONÊS
===================================================== */

function iniciarReconhecimento() {

  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if (!SpeechRecognition) {

    recognition = null;

    return;
  }


  try {

    recognition =
      new SpeechRecognition();


    recognition.lang =
      'ja-JP';

    recognition.continuous =
      false;

    recognition.interimResults =
      false;

    recognition.maxAlternatives =
      3;


    recognition.onresult =
      function(event) {

        const resultados =
          event.results[
            event.results.length - 1
          ];


        let melhor = '';


        for (
          let i = 0;
          i < resultados.length;
          i++
        ) {

          const texto =
            resultados[i].transcript;

          if (texto) {
            melhor = texto;
            break;
          }
        }


        textoReconhecido =
          melhor;
      };


    recognition.onerror =
      function(event) {

        console.log(
          'SpeechRecognition:',
          event.error
        );
      };


    recognition.start();


  } catch (erro) {

    console.log(
      'SpeechRecognition indisponível:',
      erro
    );

    recognition =
      null;
  }
}


/* =====================================================
   PARAR
===================================================== */

function pararGravacao() {

  if (
    !mediaRecorder ||
    mediaRecorder.state ===
      'inactive'
  ) {

    return;
  }


  status(
    'Analisando…'
  );


  mediaRecorder.stop();


  if (recognition) {

    try {
      recognition.stop();
    } catch (erro) {}
  }


  gravando =
    false;


  const botao =
    document.getElementById(
      'micBtn'
    );


  if (botao) {

    botao.classList.remove(
      'gravando'
    );

    botao.textContent =
      '●';

  }
}


/* =====================================================
   FINALIZAR
===================================================== */

function finalizarGravacao() {

  const mimeType =
    mediaRecorder?.mimeType ||
    'audio/mp4';


  const blob =
    new Blob(
      chunks,
      {
        type: mimeType
      }
    );


  if (gravacaoURL) {

    URL.revokeObjectURL(
      gravacaoURL
    );

  }


  gravacaoURL =
    URL.createObjectURL(
      blob
    );


  if (stream) {

    stream
      .getTracks()
      .forEach(track =>
        track.stop()
      );

  }


  stream =
    null;

  mediaRecorder =
    null;

  gravando =
    false;


  const reouvir =
    document.getElementById(
      'reouvir'
    );


  if (reouvir) {

    reouvir.style.display =
      'block';

  }


  /*
    O SpeechRecognition pode devolver
    o resultado alguns milissegundos depois
    do MediaRecorder.
  */

  setTimeout(
    avaliarPronuncia,
    650
  );
}


/* =====================================================
   AVALIAR
===================================================== */

function avaliarPronuncia() {

  const frase =
    dados.frases[indice];


  if (!textoReconhecido) {

    status(
      'Não consegui entender. Tente novamente.'
    );

    return;
  }


  const esperado =
    normalizarJapones(
      frase.japones
    );


  const falado =
    normalizarJapones(
      textoReconhecido
    );


  const similaridade =
    calcularSimilaridade(
      esperado,
      falado
    );


  console.log({
    esperado,
    falado,
    similaridade
  });


  /*
    0.72 = tolerância inicial.

    Podemos tornar mais rigoroso
    depois dos testes reais.
  */

  if (
    similaridade >= 0.72
  ) {

    status(
      '✓ Perfeito!',
      true
    );


    if (
      dados.tipo ===
      'REVISAO'
    ) {

      setTimeout(
        proximaFrase,
        1100
      );

    }

  } else {

    status(
      'Tente novamente'
    );

  }
}


/* =====================================================
   COMPARAÇÃO
===================================================== */

function normalizarJapones(texto) {

  return String(
    texto || ''
  )

    .normalize(
      'NFKC'
    )

    .replace(
      /[\s。、！？!?.,・「」『』（）()]/g,
      ''
    )

    .toLowerCase();
}


function calcularSimilaridade(
  a,
  b
) {

  if (a === b) {
    return 1;
  }


  if (!a || !b) {
    return 0;
  }


  const distancia =
    levenshtein(
      a,
      b
    );


  const tamanho =
    Math.max(
      a.length,
      b.length
    );


  return (
    1 -
    distancia / tamanho
  );
}


function levenshtein(
  a,
  b
) {

  const matriz =
    Array.from(
      {
        length:
          b.length + 1
      },
      () =>
        new Array(
          a.length + 1
        ).fill(0)
    );


  for (
    let i = 0;
    i <= b.length;
    i++
  ) {

    matriz[i][0] =
      i;

  }


  for (
    let j = 0;
    j <= a.length;
    j++
  ) {

    matriz[0][j] =
      j;

  }


  for (
    let i = 1;
    i <= b.length;
    i++
  ) {

    for (
      let j = 1;
      j <= a.length;
      j++
    ) {

      if (
        b[i - 1] ===
        a[j - 1]
      ) {

        matriz[i][j] =
          matriz[i - 1][j - 1];

      } else {

        matriz[i][j] =
          Math.min(

            matriz[i - 1][j - 1] + 1,

            matriz[i][j - 1] + 1,

            matriz[i - 1][j] + 1

          );

      }

    }

  }


  return matriz[
    b.length
  ][
    a.length
  ];
}


/* =====================================================
   REOUVIR
===================================================== */

function reouvir() {

  if (!gravacaoURL) {
    return;
  }


  new Audio(
    gravacaoURL
  ).play();
}


/* =====================================================
   SEXTA
===================================================== */

function proximaFrase() {

  if (
    indice <
    dados.frases.length - 1
  ) {

    indice++;

    gravacaoURL =
      null;

    textoReconhecido =
      '';

    renderizar();

  } else {

    document.getElementById(
      'app'
    ).innerHTML = `

      <div class="conteudo">

        <h1 class="romaji">
          ✓
        </h1>

        <div class="traducao">
          Revisão concluída.
        </div>

      </div>
    `;

  }
}


/* =====================================================
   STATUS
===================================================== */

function status(
  texto,
  certo = false
) {

  const elemento =
    document.getElementById(
      'status'
    );


  if (!elemento) {
    return;
  }


  elemento.textContent =
    texto;


  elemento.classList.toggle(
    'certo',
    certo
  );
}


/* =====================================================
   ERRO
===================================================== */

function mostrarErro(texto) {

  document.getElementById(
    'app'
  ).innerHTML = `

    <div class="erro">
      ${escapeHTML(texto)}
    </div>
  `;
}


function escapeHTML(valor) {

  return String(
    valor ?? ''
  )

    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}


carregar();

</script>

</body>
</html>
